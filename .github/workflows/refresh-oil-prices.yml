name: Refresh supplier oil prices

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-oil-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/refresh_oil_prices.py
      - name: Publish refreshed price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supplier-prices.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh supplier oil prices"
          git push
